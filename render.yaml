# Render deployment configuration for FarmBiddy Financial Forecast Skill
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: farmbiddy-forecast
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PERSISTENCE_BACKEND
        value: db
      - key: IDENTITY_PROVIDER
        value: dev
      - key: FARMBIDDY_SEED_DEMO
        value: "1"
    # DATABASE_URL is intentionally unset: default SQLite at {repo}/outputs/farmbiddy.db
    # (directory is created at startup). Instance disk is ephemeral — data resets
    # on deploy/restart. Do not set STORAGE_PATH unless a disk is actually mounted.

# ---------------------------------------------------------------------------
# OPTIONAL — persistent storage (Render Starter plan or higher, paid)
# Uncomment the disk block below and add this environment variable:
#
#   STORAGE_PATH=/opt/render/project/data
#
# Only set STORAGE_PATH when this disk is mounted. Otherwise SQLite cannot
# open the database file. Durable alternative: managed Postgres + DATABASE_URL
# + `alembic upgrade head`.
# ---------------------------------------------------------------------------
#
#    disk:
#      name: farmbiddy-data
#      mountPath: /opt/render/project/data
#      sizeGB: 1
#
#    envVars:
#      - key: STORAGE_PATH
#        value: /opt/render/project/data
